# This app's nginx vhost — copied to /etc/nginx/sites-available/audio-bunny.com
# by deploy/deploy.sh (see that script), which also renders __HOST_PORT__
# into the real port before copying. Follows ~/Sites/server-config's
# Conventions for per-app deploy scripts: includes the shared snippets so
# certbot never has to edit this file directly (always --webroot mode).
#
# Requires a cert to already exist at the paths below — deploy.sh installs
# audio-bunny.com.bootstrap.conf (HTTP-only) first on a domain that doesn't
# have one yet, requests the cert, then swaps to this file.
#
# Matches ~/Sites/pocketproducer-web's equivalent vhost, minus the /cable
# and /rails/active_storage/ blocks (this app has no Action Cable or
# Active Storage — presets are served straight from the api container's
# own storage volume via the API itself, not nginx).
server {
    listen 80;
    listen [::]:80;
    server_name audio-bunny.com www.audio-bunny.com;

    include snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name audio-bunny.com www.audio-bunny.com;

    ssl_certificate /etc/letsencrypt/live/audio-bunny.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/audio-bunny.com/privkey.pem;
    include snippets/ssl-params.conf;

    root /var/www/audio-bunny.com/web;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:__HOST_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
