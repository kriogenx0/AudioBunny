name: Deploy web

on:
  push:
    branches: [main]
    # Only deploy when the web app (or its own deploy config) actually
    # changed — this repo also holds an unrelated macOS app, whose commits
    # shouldn't trigger a redeploy of audio-bunny.com. pocketproducer-web
    # doesn't need this filter since it's a single-purpose repo.
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Build web app
        working-directory: web/frontend
        run: npm ci && npm run build

      - uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile.rails
          target: production
          load: true
          tags: audio-bunny-com-api:latest

      - name: Configure SSH agent
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H audio-bunny.com >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add - <<< "${{ secrets.DEPLOY_SSH_KEY }}"

      - name: Copy image to server
        run: |
          set -o pipefail
          docker save audio-bunny-com-api:latest | gzip | ssh deploy@audio-bunny.com 'gunzip | docker load'

      # bin/docker-entrypoint runs db:prepare on every start, so migrations
      # happen automatically once the container's up.
      - name: Deploy
        env:
          RAILS_ENV: ${{ vars.RAILS_ENV || 'production' }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT || '3306' }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ vars.DB_NAME || 'audiobunny_production' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: web/deploy/deploy.sh
